    <radialGradient id="glow2" cx="0.15" cy="0.9" r="0.6"><stop offset="0" stop-color="#c6ff3a" stop-opacity=".28"/><stop offset="1" stop-color="#c6ff3a" stop-opacity="0"/></radialGradient>
