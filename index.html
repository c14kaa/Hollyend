<style>
/* Layout: a game-style hub. Header shows the player, wallet and tabs (Play, Shop, Bank, Progress); one focused card per screen below.
   Each child has one committed look: Millie = deep space, Kristan = floodlit football pitch. Both are dark by design. */
:root {
  --bg: #080b2b; --card: #141a4d; --card2: #1c2363; --ink: #f3f1ff; --muted: #b3b7e3; --line: #2f3786;
  --accent: #ff6fb5; --accent2: #9b8cff; --on-accent: #2a0716; --accent-soft: #3a1f5c;
  --good: #4fe0a0; --good-soft: #123a33; --bad: #ff7a6b; --bad-soft: #47192f; --tip: #ffd36b; --tip-soft: #372f1c;
  --gold: #ffd36b; --gold-soft: #3a3018;
  --display: "Fredoka", "Avenir Next Rounded", "Segoe UI", system-ui, sans-serif;
  --qfont: "Fredoka", "Segoe UI", system-ui, sans-serif; --qweight: 600;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
body.k {
  --bg: #07090d; --card: #10141b; --card2: #171c25; --ink: #eef2f7; --muted: #8f99aa; --line: #242b37;
  --accent: #c6ff3a; --accent2: #3ee0ff; --on-accent: #0b1000; --accent-soft: #1b2410;
  --good: #23d17f; --good-soft: #0e271b; --bad: #ff5d62; --bad-soft: #2b1317; --tip: #c6ff3a; --tip-soft: #1b2410;
  --gold: #e9c46a; --gold-soft: #2a2414;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --qfont: "Inter", "Segoe UI", system-ui, sans-serif; --qweight: 600;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background-color: var(--bg); color: var(--ink); font: 17px/1.55 var(--body); margin: 0; min-height: 100vh; }
/* Millie's colours, background and decorations come from themes.js (MILLIE_LOOK / THEMES). */
body.k { font-size: 16px; background-image:
  radial-gradient(900px 520px at 100% -10%, rgba(198,255,58,.10), transparent 60%),
  radial-gradient(700px 500px at -20% 30%, rgba(62,224,255,.07), transparent 65%),
  linear-gradient(115deg, transparent 0 62%, rgba(255,255,255,.025) 62% 70%, transparent 70%);
  background-attachment: fixed; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 18px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.top > div:first-child { min-width: 0; }
.week { font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 7vw, 44px); line-height: 1; margin: 2px 0 0; text-wrap: balance; }
body.k h1 { font-size: clamp(44px, 11vw, 64px); font-weight: 800; font-style: italic; letter-spacing: -.005em; text-transform: uppercase; line-height: .85; }
.sub { font: 600 13px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.sub b { color: var(--accent); font-weight: 700; }
h1 em { font-style: normal; color: var(--accent); }
.wallet { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 2px solid var(--accent); border-radius: 999px; padding: 6px 14px 6px 8px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wallet svg { width: 26px; height: 26px; flex: none; }
.wallet b { font-family: var(--display); font-size: 22px; line-height: 1; }
body.k .wallet b { font-size: 28px; }
.wallet small { color: var(--muted); font-weight: 400; font-size: 13px; }
.kids { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kid { font: 700 17px var(--body); border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 16px; padding: 8px 10px; text-align: left; cursor: pointer; display: flex; gap: 10px; align-items: center; min-width: 0; }
.kid .kav { width: 46px; height: 55px; flex: none; border-radius: 10px; overflow: hidden; }
.kid .kav svg { width: 100%; height: 100%; display: block; }
.kid span.t { display: flex; flex-direction: column; min-width: 0; }
.kid small { font-weight: 400; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kid.m[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.kid.kr[aria-pressed="true"] { border-color: #ffd23f; box-shadow: 0 0 0 3px rgba(255,210,63,.25); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.vw { font: 700 15px var(--body); border: none; background: transparent; color: var(--muted); border-radius: 10px; padding: 10px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.vw svg { width: 22px; height: 22px; }
.vw[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.vw:focus-visible, .kid:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.levels { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--muted); }
.lv { font: 700 14px var(--body); border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.lv[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.focus { font-size: 14px; color: var(--muted); }
.focus b { color: var(--ink); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px 18px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.pill { background: var(--accent-soft); color: var(--accent); font-weight: 700; border-radius: 999px; padding: 3px 10px; letter-spacing: .02em; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.dot.now { background: var(--accent); }
.dot.ok { background: var(--good); }
.dot.no { background: var(--bad); }
.prompt { font-family: var(--qfont); font-weight: var(--qweight); font-size: clamp(20px, 4.6vw, 24px); line-height: 1.3; margin: 0; text-wrap: balance; }
.hero { display: grid; grid-template-columns: minmax(110px, 160px) minmax(0, 1fr); gap: 16px; align-items: center; }
.hero .bigav { width: 100%; aspect-ratio: 200 / 240; max-width: 100%; border-radius: 18px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.hero .bigav svg { width: 100%; height: 100%; display: block; }
.hero .side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.linkbtn { font: 700 14px var(--body); background: transparent; color: var(--accent); border: 1.5px solid var(--accent); border-radius: 999px; padding: 6px 12px; cursor: pointer; align-self: flex-start; }
.linkbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ftwrap { overflow-x: auto; }
table.ft { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 16px; }
table.ft th, table.ft td { border: 1px solid var(--line); padding: 6px 12px; text-align: center; }
table.ft th { text-align: left; background: var(--accent-soft); font-weight: 700; }
.opts { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 520px) { .opts { grid-template-columns: 1fr 1fr; } }
.opt { font: 700 17px var(--body); text-align: left; min-height: 56px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; display: flex; gap: 10px; align-items: center; min-width: 0; overflow-wrap: anywhere; }
.opt .key { flex: none; width: 26px; height: 26px; border-radius: 7px; background: var(--card2); color: var(--muted); display: grid; place-items: center; font-size: 13px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible, .kid:focus-visible, .lv:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.faded { opacity: .55; }
.fb { border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.fb.good { background: var(--good-soft); }
.fb.bad { background: var(--bad-soft); }
.fb h3 { margin: 0; font-family: var(--display); font-size: 20px; }
.fb.good h3 { color: var(--good); }
.fb.bad h3 { color: var(--bad); }
.fb p { margin: 0; }
.why { border-left: 3px solid var(--bad); padding-left: 10px; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }
.steps-h { font-weight: 700; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.tip { background: var(--tip-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.tip b { color: var(--tip); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { font: 700 17px var(--body); border: none; border-radius: 12px; padding: 13px 20px; cursor: pointer; background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.score { font-family: var(--display); font-weight: 800; font-size: clamp(48px, 14vw, 72px); line-height: 1; color: var(--accent); margin: 0; font-variant-numeric: tabular-nums; }
.done-msg { margin: 0; font-size: 18px; }
.review { display: flex; flex-direction: column; gap: 12px; }
.rv { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.rv .t { font-size: 13px; color: var(--muted); }
.rv .a { font-size: 15px; }
.parent { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.best { font-size: 13px; color: var(--muted); }
.vw:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.pill.cb { background: var(--gold-soft); color: var(--gold); }
.cbnote { margin: 0; font-size: 15px; color: var(--gold); font-weight: 700; }
.rank { display: flex; flex-direction: column; gap: 8px; }
.rank .nm { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; margin: 0; color: var(--accent); }
.bar { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar.t > i { background: var(--good); }
.small { font-size: 14px; color: var(--muted); margin: 0; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.bd { border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bd b { font-size: 15px; }
.bd span { font-size: 12.5px; color: var(--muted); }
.bd.on { border-style: solid; border-color: var(--gold); background: var(--gold-soft); }
.bd.on b::before { content: "\2605\00a0"; color: var(--gold); }
.bd.new { box-shadow: 0 0 0 3px var(--gold); }
.list { display: flex; flex-direction: column; gap: 6px; font-variant-numeric: tabular-nums; }
.li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; font-size: 15px; flex-wrap: wrap; }
.li:last-child { border-bottom: none; }
.tp { display: grid; grid-template-columns: minmax(0, 1fr) 70px; gap: 4px 10px; align-items: center; font-size: 15px; font-variant-numeric: tabular-nums; }
.tp .bar { grid-column: 1 / -1; height: 8px; margin-bottom: 6px; }
.sect h2 { margin: 0; font-family: var(--display); font-size: 20px; }
.earn { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--gold); margin: 0; }
.status { font-size: 13px; color: var(--muted); }
#app { display: flex; flex-direction: column; gap: 14px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.accents { display: flex; flex-wrap: wrap; gap: 6px; }
.acc { font: 700 18px var(--body); min-width: 42px; min-height: 42px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.acc:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.md { font: 700 15px var(--body); border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 1px; }
.md small { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.md[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.md:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sentence { font-family: var(--display); font-weight: 600; font-size: clamp(20px, 4.6vw, 24px); line-height: 1.35; margin: 0; padding: 14px 16px; background: var(--accent-soft); border-radius: 12px; text-wrap: balance; }
.clue { margin: 0; color: var(--muted); font-size: 16px; }
.typer { display: flex; gap: 10px; flex-wrap: wrap; }
.typer input { flex: 1 1 200px; min-width: 0; font: 700 22px var(--body); letter-spacing: .04em; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
.typer input:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.typer input.right { border-color: var(--good); background: var(--good-soft); }
.typer input.wrong { border-color: var(--bad); background: var(--bad-soft); }
.btn.hear { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
.compare { display: flex; flex-direction: column; gap: 4px; font-size: 16px; }
.compare .w { font: 700 22px var(--body); letter-spacing: .12em; }
.compare .w i { font-style: normal; background: var(--bad); color: #fff; border-radius: 4px; padding: 0 2px; }
.compare .w u { text-decoration: none; background: var(--good); color: #fff; border-radius: 4px; padding: 0 2px; }
details.list-box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
details.list-box summary { cursor: pointer; font-weight: 700; }
.wordgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; margin-top: 10px; font-size: 15px; }
.wordgrid b { font-size: 17px; }

.opt { background: var(--card2); }
.btn { font-family: var(--body); }
body.k .btn, body.k .vw, body.k .lv { text-transform: none; }
.score { font-family: var(--display); }
body.k .score { font-size: clamp(64px, 18vw, 96px); font-style: italic; color: var(--ink); align-self: flex-start; letter-spacing: -.01em; }

body.k .rank .nm, body.k .sect h2, body.k .fb h3 { font-size: 28px; letter-spacing: .01em; line-height: 1; text-transform: uppercase; font-style: italic; font-weight: 800; }
body.k .earn { font-size: 30px; }
/* sign in */
/* Sign-in: the Hollyend picture fills the screen, the lawn carries on below it, and the card sits on the lawn.
   One of four weather looks is picked at random on load (day, sunset, night, rain). */
#login { --h: clamp(300px, 43.54vw, 74vh); --w: max(100%, calc(var(--h) * 2.2967));
  position: fixed; inset: 0; z-index: 50; background: #5db026; color: #1d2a22; overflow-y: auto; }
#login .stage { position: relative; min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 0 0 max(28px, env(safe-area-inset-bottom, 0px)); box-sizing: border-box; }
#login .scene { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
#login .pic { position: absolute; inset: 0 0 auto 0; height: var(--h); overflow: hidden; z-index: 1; }
@media (max-aspect-ratio: 1/1) { #login { --h: clamp(300px, 66vw, 56vh); } }
#login .art { position: absolute; bottom: 0; left: 50%; width: var(--w); aspect-ratio: 1672 / 728; transform: translateX(-50%); }
#login .art img { width: 100%; height: 100%; display: block; -webkit-mask: linear-gradient(#000 90%, transparent); mask: linear-gradient(#000 90%, transparent); }
#login .lawn { position: absolute; inset: calc(var(--h) * .8) 0 0 0; background: url("hollyend-lawn.png") 50% 0 / var(--w) auto repeat-y, #5db026; }
.hscene .fx { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; }
.hscene .tint { inset: 0; }
.hscene[data-sky="sunset"] .art img, .hscene[data-sky="sunset"] .lawn { filter: saturate(1.1) sepia(.18) brightness(.97); }
.hscene[data-sky="sunset"] .art .tint { opacity: 1; background: linear-gradient(rgba(255,104,72,.9), rgba(255,140,90,.75) 22%, rgba(255,180,110,.35) 40%, rgba(255,170,110,.18) 60%, rgba(255,160,100,.12)); mix-blend-mode: color; }
.hscene[data-sky="sunset"] .art::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(120,40,70,.35), rgba(255,150,90,.12) 38%, transparent 60%); mix-blend-mode: multiply; }
.hscene[data-sky="sunset"] .art .haze { opacity: 1; background: radial-gradient(60% 46% at 82% 30%, rgba(255,200,120,.55), transparent 70%); mix-blend-mode: screen; }
.hscene[data-sky="sunset"] .lawn::after { content: ""; position: absolute; inset: 0; background: rgba(255,170,110,.1); mix-blend-mode: multiply; }
.hscene[data-sky="dawn"] .art img, .hscene[data-sky="dawn"] .lawn { filter: brightness(.9) saturate(.92); }
.hscene[data-sky="dawn"] .art .tint { opacity: 1; background: linear-gradient(rgba(200,150,220,.85), rgba(255,170,180,.7) 20%, rgba(255,205,160,.4) 38%, rgba(255,210,170,.12) 58%, transparent); mix-blend-mode: color; }
.hscene[data-sky="dawn"] .art::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(70,60,120,.32), rgba(255,180,170,.1) 40%, transparent 60%); mix-blend-mode: multiply; }
.hscene[data-sky="dawn"] .art .haze { opacity: 1; background: radial-gradient(55% 42% at 12% 34%, rgba(255,214,170,.6), transparent 70%); mix-blend-mode: screen; }
.hscene[data-sky="night"] .art img, .hscene[data-sky="night"] .lawn { filter: brightness(.42) saturate(.65) hue-rotate(-12deg); }
.hscene[data-sky="night"] .art .tint { opacity: 1; background: linear-gradient(rgba(14,22,70,.75), rgba(20,30,80,.4) 45%, rgba(20,30,70,.25)); mix-blend-mode: multiply; }
.hscene[data-sky="night"] .lawn::after { content: ""; position: absolute; inset: 0; background: rgba(20,30,70,.25); mix-blend-mode: multiply; }
.hscene[data-sky="night"] .stars, .hscene[data-sky="night"] .lit, .hscene[data-sky="night"] .moon { opacity: 1; }
.hscene .stars { inset: 0 0 62% 0; background:
  radial-gradient(1.6px 1.6px at 20px 30px, #fff 50%, transparent 55%) 0 0 / 190px 150px,
  radial-gradient(1.2px 1.2px at 120px 80px, #e8ecff 50%, transparent 55%) 0 0 / 190px 150px,
  radial-gradient(2px 2px at 160px 20px, #fff8e0 50%, transparent 55%) 0 0 / 190px 150px,
  radial-gradient(1px 1px at 70px 120px, #fff 50%, transparent 55%) 0 0 / 190px 150px;
  -webkit-mask: linear-gradient(#000 55%, transparent); mask: linear-gradient(#000 55%, transparent); animation: tw 4s ease-in-out infinite alternate; }
@keyframes tw { to { filter: brightness(.6); } }
.hscene .moon { inset: auto; left: 13%; top: 7%; width: 4.2%; aspect-ratio: 1; border-radius: 50%; background: #fdf6dc; box-shadow: 0 0 30px 10px rgba(253,246,220,.35), inset -8px -4px 0 rgba(200,200,190,.35); }
.hscene .lit i { position: absolute; background: #ffd27a; opacity: .82; box-shadow: 0 0 14px 3px rgba(255,200,110,.55); mix-blend-mode: screen; }
.hscene .lit b { position: absolute; width: 4%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(rgba(255,214,130,.9), rgba(255,190,90,.25) 40%, transparent 70%); }
/* Weather sits on top of the time of day: data-wx = clear | cloudy | rain. */
.hscene[data-wx="rain"]:not([data-sky="night"]) .art img, .hscene[data-wx="rain"]:not([data-sky="night"]) .lawn { filter: saturate(.5) brightness(.8) contrast(.95); }

.cc { display: flex; align-items: center; gap: 8px; min-width: 0; }

/* player card */
.pcard { --c1: #6f4a2a; --c2: #c79362; --c3: #f0c99a; --tx: #2a1608; width: 100%; max-width: 210px; aspect-ratio: 0.7; position: relative; color: var(--tx);
  clip-path: polygon(14% 0, 86% 0, 100% 6%, 100% 86%, 50% 100%, 0 86%, 0 6%);
  background: linear-gradient(155deg, var(--c3) 0%, var(--c2) 38%, var(--c1) 100%); display: flex; flex-direction: column; padding: 10px 10px 18px; font-family: var(--display); }
.pcard::before { content: ""; position: absolute; inset: 5px; clip-path: inherit; border: 0; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.28) 50%, transparent 60%); pointer-events: none; }
.pcard.silver { --c1: #6e7781; --c2: #b9c2cb; --c3: #eef2f5; --tx: #1b2026; }
.pcard.gold { --c1: #8a6414; --c2: #d6ac4a; --c3: #fbe7a6; --tx: #2b1f04; }
.pcard.elite { --c1: #05070a; --c2: #11161e; --c3: #1d2633; --tx: #c6ff3a; box-shadow: none; }
.pcard.elite::after { content: ""; position: absolute; inset: 0; clip-path: inherit; background: linear-gradient(160deg, rgba(198,255,58,.25), transparent 40%, rgba(62,224,255,.18)); pointer-events: none; }
.pc-top { display: grid; grid-template-columns: 34% 66%; position: relative; z-index: 1; height: 55%; }
.pc-ovr { display: flex; flex-direction: column; align-items: center; padding-top: 10%; line-height: .85; }

.pc-ovr span { font-size: 17px; font-weight: 700; letter-spacing: .04em; }

/* Hollyend scene: the weather is picked at random once per visit (day, sunset, night or rain) and shared by the
   sign-in page and the Me page banner. hollyendFx() gives the overlays: tint, stars, moon, clouds, lit windows. */
(function () {
  /* Time of day at Hollyend (UK): sunrise and sunset worked out for the date (central England), so dawn, day,
     sunset and night follow the real clock there. The weather (clear, cloudy or rain) is random per visit. */
  function sunHoursUTC(d) {
    var N = Math.floor((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5);
    var rad = Math.PI / 180, lat = 52.2, lon = -1.2, decl = 23.44 * Math.sin(2 * Math.PI * (284 + N) / 365);
    var B = 2 * Math.PI * (N - 81) / 364, eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
    var cosH = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(decl * rad)) / (Math.cos(lat * rad) * Math.cos(decl * rad));
    var Hh = Math.acos(Math.max(-1, Math.min(1, cosH))) / rad / 15, noon = 12 - lon / 15 - eot / 60;
    return { rise: noon - Hh, set: noon + Hh };
  }
  window.hollyendTime = function (now) {
    now = now || new Date(); var t = now.getUTCHours() + now.getUTCMinutes() / 60, s = sunHoursUTC(now);
    if (t >= s.rise - 0.6 && t < s.rise + 0.8) return "dawn";
    if (t >= s.set - 0.9 && t < s.set + 0.7) return "sunset";
    if (t >= s.rise + 0.8 && t < s.set - 0.9) return "day";
    return "night";
  };
  var r = Math.random(); window.HOLLYEND_WX = r < 0.45 ? "clear" : r < 0.7 ? "cloudy" : "rain";
  var skies = ["day", "sunset", "night", "dawn"];
  window.HOLLYEND_SKY = skies[Math.floor(Math.random() * skies.length)];
  window.hollyendClock = function () {
    var now = new Date(), tz = "Europe/London";
    var tm = now.toLocaleTimeString("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit", second: "2-digit" });
    var dt = now.toLocaleDateString("en-GB", { timeZone: tz, weekday: "short", day: "numeric", month: "short", year: "numeric" });
    var zone = (now.toLocaleTimeString("en-GB", { timeZone: tz, timeZoneName: "short" }).split(" ").pop()) || "UK";
    return { time: tm, date: dt + " · " + zone, sky: window.hollyendTime(now) };
  };
  window.hollyendWxLabel = function (sky, wx) {
    return wx === "rain" ? "Rain" : wx === "cloudy" ? "Cloudy" : { dawn: "Sunrise", day: "Sunny", sunset: "Sunset", night: "Clear night" }[sky] || "Clear";
  };
  setInterval(function () {
    var pics = document.querySelectorAll(".home-pic"); if (!pics.length) return; var c = window.hollyendClock();
    [].forEach.call(pics, function (p) { var b = p.querySelector(".clk b"), sp = p.querySelector(".clk span"); if (b) b.textContent = c.time; if (sp) sp.textContent = c.date; if (p.getAttribute("data-sky") !== c.sky) { p.setAttribute("data-sky", c.sky); var w = p.querySelector(".cam .wx"); if (w) w.textContent = "HOLLYEND · " + window.hollyendWxLabel(c.sky, p.getAttribute("data-wx")).toUpperCase(); } });
  }, 1000);
  var W = 1672, H = 728, P = function (v, d) { return (v / d * 100).toFixed(2) + "%"; };
  window.hollyendFx = function () {
    var lit = [[583,222,680,268],[565,315,680,365],[768,323,810,367],[883,323,922,367],[410,328,430,370],[444,328,464,370],
      [280,425,325,508],[390,425,495,508],[555,425,670,508],[882,425,915,480],[945,425,1050,508],[742,440,816,538]].map(function (r) {
      return '<i style="left:' + P(r[0], W) + ';top:' + P(r[1], H) + ';width:' + P(r[2] - r[0], W) + ';height:' + P(r[3] - r[1], H) + '"></i>'; }).join("") +
      [[262,437],[360,437],[525,437],[697,440],[1085,440],[1337,440]].map(function (p) { return '<b style="left:' + P(p[0], W) + ';top:' + P(p[1], H) + '"></b>'; }).join("");
    var clouds = [[8, 0], [30, -24], [52, -48], [18, -36]].map(function (c) { return '<span style="top:' + c[0] + '%;animation-delay:' + c[1] + 's"></span>'; }).join("");
    return '<div class="fx tint"></div><div class="fx haze"></div><div class="fx stars"></div><div class="fx moon"></div><div class="fx clouds">' + clouds + '</div><div class="fx lit">' + lit + '</div>';
  };
  var sc = document.querySelector("#login .scene"); if (!sc) return;
  sc.setAttribute("data-sky", window.HOLLYEND_SKY); sc.setAttribute("data-wx", window.HOLLYEND_SKY === "night" ? (window.HOLLYEND_WX === "rain" ? "rain" : "clear") : window.HOLLYEND_WX);
  sc.querySelector(".art").insertAdjacentHTML("beforeend", window.hollyendFx());
})();

      '<div class="bar"><i style="width:' + Math.round(F.known / total * 100) + '%"></i></div>' +
      '<button class="flash' + (F.flipped ? ' flipped' : '') + '" id="flCard" aria-live="polite">' +
      (F.flipped ? '<span class="fl-k">' + (state.child === "millie" ? "Spelling" : "In French") + '</span><span class="fl-big">' + esc(c.back) + '</span><span class="small">' + esc(c.extra) + '</span>'
        : '<span class="fl-k">' + (state.child === "millie" ? "It means" : "In English") + '</span><span class="fl-big sm">' + esc(c.front) + '</span><span class="small">' + esc(c.ctx) + '</span><span class="fl-tap">Tap to flip</span>') + '</button>' +
      '<div class="row">' + (canSpeak() ? '<button class="btn hear" id="flHear">Hear it</button>' : '') +
      (F.flipped ? '<button class="btn ghost" id="flAgainCard">Again</button><button class="btn" id="flGot">Got it</button>' : '<button class="btn" id="flFlip">Flip</button>') +
      '<button class="linkbtn" id="flStop">Stop</button></div><p class="small">Say the answer in your head (or out loud) before you flip. “Again” cards come back until you know them all.</p></section>';
    var flip = function () { F.flipped = true; flashView(); };
    document.getElementById("flCard").addEventListener("click", function () { if (!F.flipped) flip(); });
    var fb = document.getElementById("flFlip"); if (fb) fb.addEventListener("click", flip);
    var hr = document.getElementById("flHear"); if (hr) hr.addEventListener("click", function () { speakAloud(F.flipped ? c.speak : (c.speakFront || c.front), F.flipped ? c.lang : (state.child === "millie" ? "en-GB" : "en-GB")); });
    var g = document.getElementById("flGot"); if (g) g.addEventListener("click", function () { F.queue.shift(); F.known++; F.flipped = false; flashView(); });
    var a = document.getElementById("flAgainCard"); if (a) a.addEventListener("click", function () { var x = F.queue.shift(); F.queue.splice(Math.min(F.queue.length, 3), 0, x); F.flipped = false; flashView(); });
    document.getElementById("flStop").addEventListener("click", function () { state.flash = null; render(); });
  }

  /* ---------- wiring ---------- */
  document.addEventListener("keydown", function (e) {
    if (!busy()) return;
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    var idx = "ABCD".indexOf(e.key.toUpperCase());
    if (idx < 0 && "1234".indexOf(e.key) >= 0) idx = +e.key - 1;
    var btns = app.querySelectorAll(".opt:not([disabled])");
    if (idx >= 0 && btns[idx]) btns[idx].click();
  });
  document.getElementById("pick-millie").addEventListener("click", function () { setChild("millie"); });
  document.getElementById("pick-kristan").addEventListener("click", function () { setChild("kristan"); });
  [].forEach.call(document.querySelectorAll(".md"), function (b) { b.addEventListener("click", function () { setMode(b.dataset.m); }); });
  document.getElementById("v-quiz").addEventListener("click", function () { setView("quiz"); });
  document.getElementById("v-prog").addEventListener("click", function () { setView((state.lastSub && state.lastSub.me) || "progress"); });
  document.getElementById("v-world").addEventListener("click", function () { state.game = null; setView("world"); });
  document.getElementById("v-hw").addEventListener("click", function () { state.hwMsg = ""; setView("homework"); });
  document.getElementById("v-shop").addEventListener("click", function () { setView((state.lastSub && state.lastSub.rewards) || "bank"); });
  document.getElementById("v-cal").addEventListener("click", function () { state.calMsg = ""; setView("calendar"); });
  document.getElementById("v-hub").addEventListener("click", function () { setView("hub"); window.scrollTo({ top: 0 }); });
  document.getElementById("v-par").addEventListener("click", function () { state.hwMsg = ""; setView("parents"); });
  document.getElementById("v-bank").addEventListener("click", function () { setView("bank"); });
  [].forEach.call(document.querySelectorAll(".lv"), function (b) { b.addEventListener("click", function () { setLevel(+b.dataset.l); }); });

  document.getElementById("week").textContent = WEEK.label;
  state.level = dayLevel(new Date());
  [].forEach.call(document.querySelectorAll(".lv"), function (b) { b.setAttribute("aria-pressed", +b.dataset.l === state.level); });
  var hash = (location.hash || "").replace("#", "");
  if (hash === "spelling" || hash === "english" || hash === "french") state.mode = hash;
  if (hash === "millie-revise" || hash === "kristan-revise") { state.mode = "revise"; hash = hash.split("-")[0]; }
  if (hash === "journey") { state.view = "world"; hash = "millie"; }
  if (hash === "vocab") { state.mode = "vocab"; hash = "kristan"; }
  if (hash === "league") { state.view = "world"; hash = "kristan"; }
  if (hash === "calendar") { state.view = "calendar"; hash = ""; }
  if (hash === "family") { state.view = "parents"; hash = ""; }
  if (hash === "millie-challenge" || hash === "kristan-challenge") { state.mode = "challenge"; hash = hash.split("-")[0]; }
  setChild(hash === "kristan" || hash === "millie" ? hash : hash === "spelling" ? "millie" : (hash === "english" || hash === "french") ? "kristan" : (store("quiz-child") || "millie"));
  if (state.view === "world" || state.view === "calendar" || state.view === "parents") setView(state.view);
  document.addEventListener("hollyend:member", function (e) {
    var m = e.detail;
    if (m.role === "child") {
      document.getElementById(m.child === "millie" ? "pick-kristan" : "pick-millie").hidden = true;
      document.querySelector(".kids").style.gridTemplateColumns = "1fr";
      if (m.child === "kristan") document.querySelector(".kids").hidden = true;
      state.child = null; setChild(m.child);
    }
    var isP = m.role === "parent";
    document.getElementById("v-par").hidden = !isP;
    document.querySelector(".tabs").classList.toggle("p8", isP);
    maybeLandOnHomework(); bellSync();
  });
  document.getElementById("signout").addEventListener("click", function () { window.HOLLYEND.signOut(); });
  ["millie", "kristan"].forEach(function (c) { var w = document.getElementById("wav-" + c); if (w) w.innerHTML = avatarSVG(c, {}, "av"); });
  connect();
})();
</script>

</body>
</html>
