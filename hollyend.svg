  <g class="sunlow"><circle cx="300" cy="420" r="200" fill="url(#sunglow)"/><circle cx="300" cy="420" r="54" fill="#ffd27d"/></g>
  <g class="moon"><circle cx="1380" cy="120" r="34" fill="#f4f0dc"/><circle cx="1366" cy="110" r="7" fill="#e3dcc2"/><circle cx="1392" cy="132" r="5" fill="#e3dcc2"/></g>
