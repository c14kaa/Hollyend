  <g class="cl-day" fill="#fff" opacity=".9"><use href="#cloud" x="300" y="130"/><use href="#cloud" x="900" y="80" transform="scale(1)"/><use href="#cloud" x="1640" y="200"/></g>
  <g class="cl-rain" fill="#7c8894"><use href="#cloud" x="200" y="90"/><use href="#cloud" x="480" y="60"/><use href="#cloud" x="780" y="100"/><use href="#cloud" x="1060" y="70"/><use href="#cloud" x="1340" y="110"/><use href="#cloud" x="1620" y="70"/>
    <g fill="#6a7682"><use href="#cloud" x="340" y="150"/><use href="#cloud" x="920" y="160"/><use href="#cloud" x="1480" y="170"/></g></g>

