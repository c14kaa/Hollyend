<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Hollyend: an illustration of the house, field, forest, garage and car port. Not a photo. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fa6ec"/><stop offset=".55" stop-color="#a9d2f7"/><stop offset="1" stop-color="#e5f2fd"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb35a"/><stop offset="1" stop-color="#5d9443"/></linearGradient>
    <linearGradient id="gravel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4d9c2"/><stop offset="1" stop-color="#cfc1a4"/></linearGradient>
    <linearGradient id="render" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbf9f4"/><stop offset="1" stop-color="#ebe7de"/></linearGradient>
    <pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect width="24" height="12" fill="#a4563f"/>
      <path d="M0 .5h24M0 6.5h24M6 .5v6M18 6.5v6" stroke="#c99a84" stroke-width="1" opacity=".55"/>
      <rect x="1" y="1.5" width="4" height="4" fill="#8e4433" opacity=".35"/><rect x="13" y="7.5" width="4" height="4" fill="#b8664b" opacity=".4"/>
    </pattern>
    <pattern id="tiles" width="16" height="10" patternUnits="userSpaceOnUse">
      <rect width="16" height="10" fill="#5b3a2e"/><path d="M0 9.5h16M8 0v5M0 5v4.5M16 5v4.5" stroke="#4a2e24" stroke-width="1"/>
    </pattern>
    <pattern id="tilesdark" width="16" height="10" patternUnits="userSpaceOnUse">
      <rect width="16" height="10" fill="#3f3633"/><path d="M0 9.5h16M8 0v5M0 5v4.5M16 5v4.5" stroke="#2f2826" stroke-width="1"/>
    </pattern>
    <pattern id="boards" width="20" height="14" patternUnits="userSpaceOnUse">
      <rect width="20" height="14" fill="#7a5a43"/><path d="M0 13.5h20" stroke="#5c4232" stroke-width="2"/>
    </pattern>
    <g id="win3">
      <rect width="72" height="58" fill="#c9d0cc"/><rect x="4" y="4" width="64" height="50" fill="#3d4b55"/>
      <path d="M26 4v50M46 4v50" stroke="#c9d0cc" stroke-width="4"/><path d="M4 22h64" stroke="#c9d0cc" stroke-width="2.5"/>
      <path d="M8 8l12 12M30 8l10 10M50 8l12 12" stroke="#7f95a3" stroke-width="2" opacity=".6"/>
      <rect x="-3" y="58" width="78" height="5" fill="#e8e0cf"/>
    </g>
    <g id="cloud"><ellipse cx="0" cy="0" rx="70" ry="28"/><ellipse cx="-50" cy="8" rx="44" ry="22"/><ellipse cx="52" cy="10" rx="48" ry="20"/><ellipse cx="10" cy="-18" rx="44" ry="26"/></g>
    <g id="leafy"><circle r="46"/><circle cx="-38" cy="18" r="34"/><circle cx="40" cy="16" r="36"/><circle cx="4" cy="-30" r="34"/></g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <g fill="#fff" opacity=".92"><use href="#cloud" x="260" y="120"/><use href="#cloud" x="1180" y="90"/><use href="#cloud" x="760" y="200" transform="scale(1)" opacity=".8"/><use href="#cloud" x="1460" y="250" opacity=".75"/></g>

  <!-- forest behind and to the right -->
  <g fill="#2f5e34"><use href="#leafy" x="380" y="520"/><use href="#leafy" x="470" y="490"/><use href="#leafy" x="560" y="470"/><use href="#leafy" x="660" y="450"/><use href="#leafy" x="760" y="430"/>
    <use href="#leafy" x="860" y="440"/><use href="#leafy" x="960" y="430"/><use href="#leafy" x="1060" y="440"/><use href="#leafy" x="1160" y="420"/><use href="#leafy" x="1260" y="430"/>
    <use href="#leafy" x="1360" y="410"/><use href="#leafy" x="1460" y="420"/><use href="#leafy" x="1560" y="400"/><use href="#leafy" x="1600" y="470"/></g>
  <g fill="#264d2b"><use href="#leafy" x="1210" y="500"/><use href="#leafy" x="1320" y="480"/><use href="#leafy" x="1430" y="490"/><use href="#leafy" x="1540" y="480"/><use href="#leafy" x="1110" y="510"/>
    <use href="#leafy" x="600" y="540"/><use href="#leafy" x="500" y="560"/></g>
  <g fill="#3d7340" opacity=".9"><use href="#leafy" x="300" y="560"/><use href="#leafy" x="200" y="590" transform="scale(1)"/></g>

  <rect x="0" y="640" width="1600" height="260" fill="#6ea64f"/>
  <!-- the field on the left, with a post-and-rail fence and horses -->
  <path d="M0 610 Q260 590 560 640 L560 900 L0 900 Z" fill="url(#grass)"/>
  <g stroke="#f2ead9" stroke-width="5" stroke-linecap="round" fill="none"><path d="M0 668 Q250 650 520 690"/><path d="M0 690 Q250 672 520 712"/></g>
  <g fill="#e9e0cc"><rect x="20" y="652" width="8" height="52"/><rect x="140" y="645" width="8" height="54"/><rect x="260" y="648" width="8" height="56"/><rect x="380" y="660" width="8" height="56"/><rect x="500" y="676" width="8" height="54"/></g>
  <!-- horse 1 (bay) -->
  <g transform="translate(170 610)">
    <path d="M0 0 C10 -10 70 -12 86 -2 L92 -30 C96 -42 112 -44 118 -36 L124 -22 C126 -16 120 -12 114 -16 L106 -20 L104 4 C100 14 86 18 80 16 L14 16 C2 14 -6 8 0 0 Z" fill="#7a4428"/>
    <path d="M100 -38 L110 -42 L104 -30 Z M94 -28 C88 -16 86 -6 86 -2" fill="#3d2214"/>
    <g stroke="#7a4428" stroke-width="7" stroke-linecap="round"><path d="M10 14v30M24 15v30M76 15v30M90 12v30"/></g>
    <g stroke="#2b1a10" stroke-width="7"><path d="M10 40v6M24 41v6M76 41v6M90 38v6"/></g>
    <path d="M0 2 C-14 6 -16 26 -10 34" stroke="#3d2214" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="114" cy="-30" r="2" fill="#111"/>
  </g>
  <!-- horse 2 (grey, grazing) -->
  <g transform="translate(330 650) scale(.85)">
    <path d="M0 0 C10 -10 70 -12 86 -2 L106 30 C110 38 104 44 96 40 L84 26 L80 16 L14 16 C2 14 -6 8 0 0 Z" fill="#d9d4cb"/>
    <path d="M86 -2 L100 22" stroke="#b3ab9e" stroke-width="6"/>
    <g stroke="#d9d4cb" stroke-width="7" stroke-linecap="round"><path d="M10 14v30M24 15v30M70 15v30M80 14v30"/></g>
    <g stroke="#6c665d" stroke-width="7"><path d="M10 40v6M24 41v6M70 41v6M80 40v6"/></g>
    <path d="M0 2 C-14 6 -16 26 -10 34" stroke="#a9a196" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- gravel drive -->
  <path d="M470 900 C520 760 600 720 700 712 L1600 700 L1600 900 Z" fill="url(#gravel)"/>

  <!-- main house: white upper floors and hipped roof -->
  <g>
    <path d="M626 400 L700 262 L968 262 L1044 400 Z" fill="url(#tiles)"/>
    <path d="M700 262 L968 262" stroke="#3e271e" stroke-width="4"/>
    <!-- roof windows -->
    <g fill="#33424d" stroke="#d9dcd6" stroke-width="3"><path d="M760 300h44l-6 34h-44z"/><path d="M880 300h44l-4 34h-44z"/></g>
    <!-- dormer -->
    <path d="M896 340 L960 340 L960 392 L896 392 Z" fill="url(#render)"/><path d="M886 344 L928 316 L970 344 Z" fill="#4e3227"/>
    <rect x="906" y="350" width="44" height="34" fill="#3d4b55" stroke="#c9d0cc" stroke-width="4"/><path d="M928 350v34" stroke="#c9d0cc" stroke-width="3"/>
    <rect x="640" y="398" width="392" height="168" fill="url(#render)"/>
    <path d="M630 400 H1044" stroke="#2c2c2c" stroke-width="5"/>
    <!-- right wing -->
    <rect x="1032" y="440" width="96" height="126" fill="#f2efe8"/>
    <path d="M1024 446 L1060 404 L1110 404 L1140 446 Z" fill="url(#tiles)"/><path d="M1024 446 H1140" stroke="#2c2c2c" stroke-width="4"/>
    <rect x="1060" y="470" width="40" height="48" fill="#3d4b55" stroke="#c9d0cc" stroke-width="4"/>
    <use href="#win3" x="702" y="448"/><use href="#win3" x="872" y="448"/>
    <path d="M1032 402 V566" stroke="#2c2c2c" stroke-width="5"/>
    <path d="M652 402 V566" stroke="#2c2c2c" stroke-width="4"/>
  </g>

  <!-- brick ground-floor extension with stone coping -->
  <rect x="560" y="566" width="590" height="140" fill="url(#brick)"/>
  <rect x="554" y="558" width="602" height="10" fill="#e8e0cf"/>
  <rect x="560" y="700" width="590" height="8" fill="#8a4230"/>
  <use href="#win3" x="586" y="604" transform="translate(0 0)"/>
  <g transform="translate(690 596)"><rect width="150" height="88" fill="#c9d0cc"/><rect x="5" y="5" width="140" height="78" fill="#3d4b55"/>
    <path d="M42 5v78M75 5v78M108 5v78" stroke="#c9d0cc" stroke-width="4"/><path d="M20 5v78M58 5v78M92 5v78M126 5v78" stroke="#c9d0cc" stroke-width="2"/>
    <path d="M12 12l18 18M82 12l16 16" stroke="#7f95a3" stroke-width="2" opacity=".6"/><rect x="-4" y="88" width="158" height="5" fill="#e8e0cf"/></g>
  <!-- bay window -->
  <g transform="translate(880 590)"><rect x="-6" y="-8" width="132" height="10" fill="#e8e0cf"/><rect width="120" height="96" fill="#c9d0cc"/><rect x="5" y="5" width="110" height="86" fill="#3d4b55"/>
    <path d="M25 5v86M60 5v86M95 5v86" stroke="#c9d0cc" stroke-width="4"/><path d="M5 30h110" stroke="#c9d0cc" stroke-width="2"/><rect x="-6" y="96" width="132" height="6" fill="#e8e0cf"/></g>
  <!-- porch with grey front door -->
  <g transform="translate(1020 560)">
    <path d="M-8 34 L46 -10 L100 34 Z" fill="url(#tiles)"/><path d="M4 32 L46 -2 L88 32" fill="none" stroke="#f4f1ea" stroke-width="4"/>
    <rect x="6" y="34" width="80" height="112" fill="url(#brick)"/>
    <rect x="22" y="48" width="48" height="98" fill="#e8e0cf"/><rect x="28" y="54" width="36" height="92" fill="#6f7f80"/>
    <rect x="32" y="58" width="13" height="38" fill="#9fb1b5"/><rect x="47" y="58" width="13" height="38" fill="#9fb1b5"/><circle cx="58" cy="104" r="2" fill="#d8c27a"/>
    <rect x="16" y="146" width="62" height="6" fill="#e8e0cf"/>
  </g>
  <!-- lanterns and downpipes -->
  <g fill="#222"><rect x="676" y="612" width="8" height="12"/><rect x="866" y="612" width="8" height="12"/><rect x="1012" y="610" width="8" height="12"/></g>
  <g stroke="#1f1f1f" stroke-width="5"><path d="M660 566 V708"/><path d="M1006 566 V708"/></g>
  <!-- white hydrangeas -->
  <g>
    <g fill="#4f7d3a"><ellipse cx="610" cy="702" rx="54" ry="22"/><ellipse cx="720" cy="704" rx="60" ry="22"/><ellipse cx="830" cy="704" rx="52" ry="20"/><ellipse cx="930" cy="704" rx="44" ry="18"/></g>
    <g fill="#f4f6ec"><circle cx="580" cy="690" r="10"/><circle cx="604" cy="684" r="11"/><circle cx="630" cy="690" r="10"/><circle cx="650" cy="698" r="8"/><circle cx="690" cy="690" r="10"/><circle cx="716" cy="684" r="12"/><circle cx="742" cy="690" r="10"/><circle cx="764" cy="698" r="8"/><circle cx="806" cy="692" r="10"/><circle cx="830" cy="686" r="11"/><circle cx="856" cy="694" r="9"/><circle cx="912" cy="694" r="9"/><circle cx="936" cy="690" r="10"/></g>
    <g fill="#dfe8c9"><circle cx="594" cy="698" r="7"/><circle cx="702" cy="700" r="7"/><circle cx="818" cy="700" r="7"/><circle cx="924" cy="702" r="6"/></g>
  </g>

  <!-- double garage to the right -->
  <g transform="translate(1180 0)">
    <path d="M-14 600 L30 540 L230 540 L266 600 Z" fill="url(#tilesdark)"/>
    <rect x="34" y="510" width="22" height="40" fill="url(#brick)"/><rect x="31" y="506" width="28" height="6" fill="#8a4230"/>
    <rect x="0" y="600" width="252" height="104" fill="url(#brick)"/><path d="M-6 600 H258" stroke="#f1ede4" stroke-width="4"/>
    <g fill="#4a2b1d"><path d="M18 704 V640 Q60 622 102 640 V704 Z"/><path d="M140 704 V640 Q182 622 224 640 V704 Z"/></g>
    <g stroke="#3a2015" stroke-width="2"><path d="M39 636v68M60 630v74M81 636v68M161 636v68M182 630v74M203 636v68"/></g>
    <path d="M16 640 Q60 620 104 640 M138 640 Q182 620 226 640" stroke="#b9664c" stroke-width="5" fill="none"/>
  </g>

  <!-- oak car port further right -->
  <g transform="translate(1440 0)">
    <path d="M-16 610 L36 548 L134 548 L186 610 Z" fill="url(#tiles)"/>
    <rect x="0" y="610" width="40" height="96" fill="url(#boards)"/>
    <rect x="40" y="610" width="130" height="96" fill="#3a2a1e"/>
    <g fill="#8c6a4f"><rect x="38" y="610" width="10" height="96"/><rect x="100" y="610" width="10" height="96"/><rect x="160" y="610" width="10" height="96"/></g>
    <path d="M48 622 L66 610 M110 622 L92 610 M110 622 L128 610 M160 622 L142 610" stroke="#8c6a4f" stroke-width="5"/>
    <g fill="#7a6a5c"><rect x="56" y="684" width="34" height="22"/><rect x="118" y="680" width="10" height="26"/><rect x="130" y="672" width="10" height="34"/></g>
  </g>

  <!-- tree with a swing, right of the house -->
  <g transform="translate(1330 0)">
    <path d="M-10 720 C-6 660 -8 600 -16 560 M-12 600 C10 580 40 572 78 566" stroke="#5b3f2a" stroke-width="18" fill="none" stroke-linecap="round"/>
    <g fill="#3f7a3c"><use href="#leafy" x="-20" y="500"/><use href="#leafy" x="40" y="520"/><use href="#leafy" x="-60" y="540"/></g>
    <g fill="#4f8f46"><use href="#leafy" x="10" y="470" transform="scale(1)"/></g>
    <g stroke="#e8dcc0" stroke-width="2.5"><path d="M48 572 V668"/><path d="M70 568 V668"/></g>
    <rect x="42" y="666" width="34" height="7" rx="2" fill="#8a5a36"/>
  </g>

</svg>
