<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" preserveAspectRatio="xMidYMid slice" data-sky="day">
  <!-- Hollyend: an illustration (not a photo). The sky changes with data-sky = day | sunset | night | rain. -->
  <style>
    .sky, .ov, .sun, .sunlow, .moon, .stars, .rain, .cl-day, .cl-rain, .glow { display: none; }
    svg[data-sky="day"] .sky-day, svg[data-sky="day"] .sun, svg[data-sky="day"] .cl-day { display: inline; }
    svg[data-sky="sunset"] .sky-sunset, svg[data-sky="sunset"] .sunlow, svg[data-sky="sunset"] .cl-day, svg[data-sky="sunset"] .ov-sunset, svg[data-sky="sunset"] .glow { display: inline; }
    svg[data-sky="night"] .sky-night, svg[data-sky="night"] .moon, svg[data-sky="night"] .stars, svg[data-sky="night"] .ov-night, svg[data-sky="night"] .glow { display: inline; }
    svg[data-sky="rain"] .sky-rain, svg[data-sky="rain"] .cl-rain, svg[data-sky="rain"] .rain, svg[data-sky="rain"] .ov-rain { display: inline; }
    .gl { fill: #3e5260; }
    svg[data-sky="night"] .gl { fill: #ffd98a; }
    svg[data-sky="sunset"] .gl { fill: #f3b77a; }
    .cl-day use { animation: drift 90s linear infinite alternate; }
    .stars circle { animation: twinkle 3s ease-in-out infinite alternate; }
    .stars circle:nth-child(3n) { animation-delay: 1.2s; } .stars circle:nth-child(4n) { animation-delay: 2.1s; }
    .rain path { animation: fall .7s linear infinite; }
    .rain path:nth-child(2n) { animation-duration: .9s; } .rain path:nth-child(3n) { animation-delay: .3s; }
    @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(40px); } }
    @keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
    @keyframes fall { from { transform: translate(0, -60px); } to { transform: translate(-18px, 120px); } }
    @media (prefers-reduced-motion: reduce) { .cl-day use, .stars circle, .rain path { animation: none; } }
  </style>
  <defs>
    <linearGradient id="g-day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ea4e8"/><stop offset=".6" stop-color="#a8d1f5"/><stop offset="1" stop-color="#e6f2fc"/></linearGradient>
    <linearGradient id="g-sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3f7a"/><stop offset=".45" stop-color="#c9667a"/><stop offset=".75" stop-color="#f4a261"/><stop offset="1" stop-color="#ffd9a0"/></linearGradient>
    <linearGradient id="g-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b24"/><stop offset=".6" stop-color="#16214f"/><stop offset="1" stop-color="#2c3a6e"/></linearGradient>
    <linearGradient id="g-rain" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d7a87"/><stop offset=".7" stop-color="#a3adb6"/><stop offset="1" stop-color="#c7ced4"/></linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86b866"/><stop offset="1" stop-color="#5f9748"/></linearGradient>
    <linearGradient id="gravel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9dfca"/><stop offset="1" stop-color="#d3c5a7"/></linearGradient>
    <linearGradient id="render" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbfaf6"/><stop offset="1" stop-color="#ece8df"/></linearGradient>
    <radialGradient id="sunglow"><stop offset="0" stop-color="#fff6c9"/><stop offset=".35" stop-color="#ffe7a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe7a0" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/></radialGradient>
    <pattern id="brick" width="22" height="11" patternUnits="userSpaceOnUse"><rect width="22" height="11" fill="#a95c45"/><path d="M0 .5h22M0 6h22M5.5 .5v5.5M16.5 6v5" stroke="#c8957f" stroke-width=".8" opacity=".5"/></pattern>
    <pattern id="tiles" width="14" height="9" patternUnits="userSpaceOnUse"><rect width="14" height="9" fill="#62402f"/><path d="M0 8.5h14M7 0v4.5" stroke="#523426" stroke-width=".9"/></pattern>
    <pattern id="tiles2" width="14" height="9" patternUnits="userSpaceOnUse"><rect width="14" height="9" fill="#4a3d38"/><path d="M0 8.5h14M7 0v4.5" stroke="#3b302c" stroke-width=".9"/></pattern>
    <pattern id="boards" width="18" height="12" patternUnits="userSpaceOnUse"><rect width="18" height="12" fill="#8a6a50"/><path d="M0 11.5h18" stroke="#6d5240" stroke-width="1.6"/></pattern>
    <g id="cloud"><ellipse rx="64" ry="24"/><ellipse cx="-46" cy="8" rx="40" ry="19"/><ellipse cx="48" cy="9" rx="44" ry="18"/><ellipse cx="8" cy="-16" rx="40" ry="23"/></g>
    <g id="tree"><circle r="44"/><circle cx="-36" cy="16" r="32"/><circle cx="38" cy="14" r="34"/><circle cx="4" cy="-28" r="32"/></g>
    <!-- sash window: w 56 h 46 -->
    <g id="win"><rect width="56" height="46" rx="1" fill="#cdd4cf"/><rect class="gl" x="3.5" y="3.5" width="49" height="39"/><path d="M28 3.5v39M3.5 19h49" stroke="#cdd4cf" stroke-width="3"/><path d="M16 3.5v39M40 3.5v39" stroke="#cdd4cf" stroke-width="1.5"/><rect x="-3" y="46" width="62" height="4" fill="#ece5d6"/></g>
  </defs>

  <!-- skies -->
  <rect class="sky sky-day" width="1800" height="760" fill="url(#g-day)"/>
  <rect class="sky sky-sunset" width="1800" height="760" fill="url(#g-sunset)"/>
  <rect class="sky sky-night" width="1800" height="760" fill="url(#g-night)"/>
