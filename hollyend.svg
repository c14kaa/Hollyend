    <circle cx="730" cy="150" r="1.7"/><circle cx="860" cy="70" r="1.3"/><circle cx="960" cy="160" r="1.1"/><circle cx="1050" cy="50" r="1.9"/><circle cx="1160" cy="130" r="1.2"/><circle cx="1260" cy="210" r="1.4"/>
    <circle cx="1500" cy="60" r="1.5"/><circle cx="1600" cy="170" r="1.2"/><circle cx="1700" cy="80" r="1.7"/><circle cx="1760" cy="220" r="1.1"/><circle cx="140" cy="250" r="1.3"/><circle cx="600" cy="240" r="1"/>
